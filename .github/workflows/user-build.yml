name: User Build Full
on:
  workflow_dispatch:
jobs:
  build:
    name: Build Full
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: NPM Install
        run: npm install

      - name: Clone Dependencies
        run: bash ./scripts/clone-deps.sh

      - name: Cache Build Directory
        uses: actions/cache@v4
        with:
          path: build/
          key: ${{ runner.os }}-ocjs-build-${{ hashFiles('DEPS.json', 'scripts/clone-deps.sh') }}
          restore-keys: |
            ${{ runner.os }}-ocjs-build-

      - name: Build WebAssembly (Full)
        run: ./build-wasm.sh --config single-threaded full build-configs/full.yml

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencascade-js-full
          path: |
            dist/*.js
            dist/*.wasm
            dist/*.d.ts
